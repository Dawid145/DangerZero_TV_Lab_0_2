plugins { id 'com.android.application' }

android {
    namespace 'com.dangerzero.tvlab'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dangerzero.tvlab'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug { minifyEnabled false }
    }
}
